# general settings
name: CAME_SAIGFormer_lolv1
model_type: CAMEModel
use_amp: False
scale: 1
num_gpu: 1
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage
    dataroot_gt: /home/fds-admin/user_files/lihanting/LOLdataset/our485/high
    dataroot_lq: /home/fds-admin/user_files/lihanting/LOLdataset/our485/low
    geometric_augs: true

    filename_tmpl: '{}'
    io_backend:
      type: disk

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8

    mini_batch_sizes: [8]
    iters: [200000]
    gt_size: 128
    gt_sizes: [128]

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_PairedImage
    dataroot_gt: /home/fds-admin/user_files/lihanting/LOLdataset/eval15/high
    dataroot_lq: /home/fds-admin/user_files/lihanting/LOLdataset/eval15/low
    io_backend:
      type: disk
    val_batch_size: 4
    val_num_worker: 8

# network structures
network_g:
  type: CAME_SAIGFormer
  embed_dim: 32
  train_patch: 128
  eps: !!float 1e-1
  descriptor_dim: 64
  num_interventions: 2

# path
path:
  root: /home/fds-admin/user_files/lihanting/model_output
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
# 消融实验用 100K 即可看趋势；最终论文数据用 200K
train:
  total_iter: 200000
  warmup_iter: 2000
  use_grad_clip: true

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [60000, 140000]
    restart_weights: [1, 1]
    eta_mins: [0.0003, 0.000001]

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: Adam
    lr: !!float 2e-4
    betas: [0.9, 0.999]

  # Standard pixel losses
  pixel_opt:
    - type: L1Loss
      loss_weight: 1
      reduction: mean
    - type: SSIMLoss

  # CAME-specific losses
  came_loss_opt:
    rec_weight: 1.0
    ssim_weight: 1.0
    content_inv_weight: 0.1
    cycle_weight: 0.05
    raed_weight: 0.05
    obs_smooth_weight: 0.01
    warmup_iter: 5000  # Start CAME losses after 5K iterations

# validation settings
val:
  window_size: 4
  val_freq: !!float 0.5e2
  save_img: false
  rgb2bgr: true
  use_image: false
  max_minibatch: 8

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 50
  save_checkpoint_freq: !!float 1e3
  use_tb_logger: true
  logger_path: /home/fds-admin/user_files/lihanting/model_output
  wandb:
    project: low_light
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
