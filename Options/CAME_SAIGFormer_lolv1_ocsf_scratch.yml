# LOL-v1 OCSF training from random initialization.
# The filename determines the experiment directory in basicsr/utils/options.py.
name: CAME_SAIGFormer_lolv1_ocsf_scratch
model_type: CAMEModel
use_amp: false
amp_init_scale: 1024.0
scale: 1
num_gpu: 1
manual_seed: 100

datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage
    dataroot_gt: ./datasets/LOL-v1/our485/high
    dataroot_lq: ./datasets/LOL-v1/our485/low
    geometric_augs: true
    filename_tmpl: '{}'
    io_backend:
      type: disk
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    mini_batch_sizes: [8]
    iters: [160000]
    gt_size: 128
    gt_sizes: [128]
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_PairedImage
    dataroot_gt: ./datasets/LOL-v1/eval15/high
    dataroot_lq: ./datasets/LOL-v1/eval15/low
    io_backend:
      type: disk
    val_batch_size: 1
    val_num_worker: 4

network_g:
  type: CAME_SAIGFormer
  embed_dim: 32
  train_patch: 128
  eps: !!float 1e-1
  descriptor_dim: 64
  num_interventions: 2
  use_camt: true
  use_manifold_illumination: true
  use_observability: true
  use_counterfactual: true
  use_selective_skip_fusion: true

path:
  root: ./outputs
  pretrain_network_g: ~
  strict_load_g: true
  param_key: params
  resume_state: ~

train:
  total_iter: 160000
  warmup_iter: 2000
  grad_clip_norm: 1.0
  ema_decay: 0.999

  # First learn the full restoration mapping, then perform a gentler
  # low-learning-rate refinement instead of restarting at the full 2e-4.
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [80000, 80000]
    restart_weights: [1, 0.25]
    eta_mins: [0.000001, 0.0000001]

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: Adam
    lr: !!float 2e-4
    betas: [0.9, 0.999]

  # RGB-PSNR-oriented but conservative enough for random initialization.
  pixel_opt:
    - type: L1Loss
      loss_weight: 1
      reduction: mean
    - type: SSIMLoss
      loss_weight: 0.2
    - type: PSNRLoss
      loss_weight: 0.01
      reduction: mean
      toY: false

  came_loss_opt:
    content_inv_weight: 0.05
    cycle_weight: 0.02
    raed_weight: 0.03
    obs_smooth_weight: 0.01
    disentangle_weight: 0.01
    intervention_diversity_weight: 0.005
    use_raed: true
    use_cycle: true
    use_disentangle: true
    use_intervention_diversity: true
    warmup_iter: 5000
    decay_start_iter: 80000
    decay_end_iter: 120000
    min_auxiliary_scale: 0.1

val:
  window_size: 4
  val_freq: !!float 5e2
  save_img: false
  rgb2bgr: true
  use_image: false
  max_minibatch: 1
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 50
  save_checkpoint_freq: !!float 1e3
  use_tb_logger: true
  logger_path: ./tb_logger
  wandb:
    project: low_light
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
